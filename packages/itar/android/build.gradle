plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.facebook.react'
}
react {
    root = file('..')
    reactNativeDir = file('../../../node_modules/react-native')
    codegenDir = file('../../../node_modules/@react-native/codegen')
    libraryName = 'ItarSpec'
    codegenJavaPackageName = 'com.itar.adapter'
}
android {
    namespace 'com.itar.adapter'
    compileSdk 36
    ndkVersion '27.1.12297006'
    defaultConfig {
        minSdk 24
        ndk { abiFilters.addAll((findProperty('reactNativeArchitectures') ?: 'arm64-v8a').split(',')) }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
    }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
    sourceSets.debug.java.srcDirs += file('tests/support')
}
dependencies { implementation 'com.facebook.react:react-android' }
