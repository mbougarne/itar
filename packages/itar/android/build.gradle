plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.facebook.react'
}
// Resolve from the installed library so scoped and hoisted dependencies both work.
def resolvePackageDir = { String name ->
    def manifest = providers.exec {
        workingDir projectDir
        commandLine 'node', '--print', "require.resolve('${name}/package.json')"
    }.standardOutput.asText.get().trim()
    return new File(manifest).parentFile
}
react {
    root = file('..')
    reactNativeDir = resolvePackageDir('react-native')
    codegenDir = resolvePackageDir('@react-native/codegen')
    libraryName = 'ItarSpec'
    codegenJavaPackageName = 'com.itar.adapter'
}
android {
    namespace 'com.itar.adapter'
    compileSdk 36
    ndkVersion '27.1.12297006'
    defaultConfig {
        minSdk 24
        ndk { abiFilters.addAll((findProperty('reactNativeArchitectures') ?: 'arm64-v8a').split(',')) }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
    }
    externalNativeBuild { cmake { path 'CMakeLists.txt'; version '3.22.1' } }
    sourceSets.debug.java.srcDirs += file('tests/support')
    // Only Cinema supplies a recorder, exclusively for its debug variant.
    def noCapture = file('src/noCapture/java')
    def capture = rootProject.findProperty('itarOccoCaptureDir')
    buildTypes.configureEach { variant ->
        sourceSets[variant.name].java.srcDir(variant.name == 'debug' && capture ? file(capture) : noCapture)
    }
}
dependencies { implementation 'com.facebook.react:react-android' }
